
name:"Estrutura de diretorios e arquivos"

on:
  push:
    branches:[main]
  workflow_dispatch:

  env:
    NODE_VERSION: '18'

  jobs:
   demonstrando-estrutura-basica:
    name: "Demonstrando estrutura basica"
    runs-on: ubuntu-latest

    steps:
      - name: 01-Checkout do repositório
        uses: actions/checkout@v3

      - name: 02-Configurar Node.js
        run:|
          echo"Configurando Node.js versão {{$NODE_VERSION}}"
          ls -la .github/workflows
          echo""
          echo"Total de workflows" $(ls -l .github/workflows | wc -l  )"

      -name:03-Elementos Obrigatorios
       run:|
         echo"Elementos Obrigatorios em um workflow"
         echo""
         echo"1. name: Nome do workflow"
         echo"2. on: Evento que dispara o workflow"
         echo"3. jobs: Conjunto de tarefas a serem executadas"
            